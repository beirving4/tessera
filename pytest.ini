[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    requires_hdf5: mark test as requiring HDF5 support
    requires_tree_file: mark test as requiring a merger tree file

# Output options
addopts = -v --tb=short

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
