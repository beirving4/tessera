name: CI

# TEMPORARILY DISABLED - GitHub Actions billing issue
# Uncomment the triggers below when billing is resolved
on:
  workflow_dispatch:  # Manual trigger only
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libomp-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install hdf5 libomp cmake

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest

      - name: Build and install
        run: pip install -v .

      - name: Test import
        run: |
          python -c "
          import tessera
          print('tessera version:', tessera.__version__)
          print('Available submodules:')
          for name in ['geom', 'math', 'density', 'io', 'cosmo', 'origami']:
              mod = getattr(tessera, name, None)
              print(f'  {name}: {\"available\" if mod else \"not available\"}')
          "

      - name: Test density module
        run: |
          python -c "
          import numpy as np
          import _tessera as ts

          # Basic functionality test
          config = ts.density.TetraDensityConfig()
          config.lagrangian_grid_size = 8
          config.box_size = 10.0
          config.output_cells = 16
          config.n_samples = 10
          config.n_threads = 1
          config.periodic = True

          positions = np.random.uniform(0, 10, (8**3, 3)).astype(np.float64)
          positions = np.ascontiguousarray(positions)

          result = ts.density.compute_tetra_density_2d_projection(positions, config, 2)
          print(f'2D projection test passed: {len(result.density)} cells')
          "

      - name: Test ORIGAMI module
        run: |
          python -c "
          import numpy as np
          import _tessera as ts

          # Basic ORIGAMI test
          config = ts.origami.OrigamiConfig()
          config.lagrangian_grid_size = 8
          config.box_size = 10.0
          config.n_threads = 1
          config.n_split = 1

          positions = np.random.uniform(0, 10, (8**3, 3)).astype(np.float64)
          positions = np.ascontiguousarray(positions)

          result = ts.origami.compute_morphology(positions, config)
          print(f'ORIGAMI test passed: {len(result.morphology)} particles classified')
          print(f'Linear regime detection: is_linear_regime = {result.is_linear_regime}')
          "

      - name: Test stats module
        run: |
          python -c "
          import numpy as np
          import _tessera as ts

          # Basic stats test
          np.random.seed(42)
          values = np.random.lognormal(0, 0.5, 1000).astype(np.float64)

          # Test histogram_log
          hist = ts.stats.histogram_log(values, n_bins=20)
          print(f'histogram_log test passed: {len(hist.counts)} bins')

          # Test jackknife histogram
          positions = np.random.uniform(0, 10, (1000, 3)).astype(np.float64)
          jk = ts.stats.compute_jackknife_histogram(
              positions, values, 10.0, 20, 0.1, 10.0, True, 2, 0
          )
          print(f'Jackknife histogram test passed: {jk.n_bins} bins, {jk.n_subboxes} subboxes')
          "

      - name: Run pytest test suite
        env:
          KMP_DUPLICATE_LIB_OK: TRUE
        run: |
          python -m pytest tests/ -v --ignore=tests/test_io.py -k "not requires_tree_file"

  # CentOS 7 / manylinux2014 build (for HPC cluster compatibility)
  # Uses manylinux2014 which is CentOS 7 based with devtoolset pre-configured
  build-centos7:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux2014_x86_64

    steps:
      # Manual checkout because actions/checkout uses Node 20 which requires glibc 2.27+
      # but manylinux2014 (CentOS 7) only has glibc 2.17
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory /__w/tessera/tessera
          git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Install Python dependencies
        run: |
          /opt/python/cp310-cp310/bin/python -m pip install numpy pytest scikit-build-core pybind11

      - name: Build and install
        run: |
          # manylinux2014 has devtoolset-10 in PATH by default
          # Build without HDF5 since manylinux2014 has HDF5 1.8.x but HighFive requires 1.10+
          /opt/python/cp310-cp310/bin/python -m pip install -v . --config-settings=cmake.args="-DBUILD_WITH_HDF5=OFF"

      - name: Test import
        run: |
          /opt/python/cp310-cp310/bin/python -c "
          import tessera
          print('tessera version:', tessera.__version__)
          print('manylinux2014 (CentOS 7) build successful!')
          "

      - name: Test density module
        run: |
          /opt/python/cp310-cp310/bin/python -c "
          import numpy as np
          import _tessera as ts

          config = ts.density.TetraDensityConfig()
          config.lagrangian_grid_size = 8
          config.box_size = 10.0
          config.output_cells = 16
          config.n_samples = 10
          config.n_threads = 1
          config.periodic = True

          positions = np.random.uniform(0, 10, (8**3, 3)).astype(np.float64)
          positions = np.ascontiguousarray(positions)

          result = ts.density.compute_tetra_density_2d_projection(positions, config, 2)
          print(f'2D projection test passed: {len(result.density)} cells')
          "

      - name: Test ORIGAMI module
        run: |
          /opt/python/cp310-cp310/bin/python -c "
          import numpy as np
          import _tessera as ts

          config = ts.origami.OrigamiConfig()
          config.lagrangian_grid_size = 8
          config.box_size = 10.0
          config.n_threads = 1
          config.n_split = 1

          positions = np.random.uniform(0, 10, (8**3, 3)).astype(np.float64)
          positions = np.ascontiguousarray(positions)

          result = ts.origami.compute_morphology(positions, config)
          print(f'ORIGAMI test passed: {len(result.morphology)} particles classified')
          "

  # RHEL 8 / manylinux_2_28 build (for newer HPC clusters)
  # Uses manylinux_2_28 which is AlmaLinux 8 based (RHEL 8 compatible)
  build-rhel8:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install HDF5
        run: |
          dnf install -y hdf5-devel

      - name: Install Python dependencies
        run: |
          /opt/python/cp310-cp310/bin/python -m pip install numpy pytest scikit-build-core pybind11

      - name: Build and install
        run: |
          /opt/python/cp310-cp310/bin/python -m pip install -v .

      - name: Test import
        run: |
          /opt/python/cp310-cp310/bin/python -c "
          import tessera
          print('tessera version:', tessera.__version__)
          print('manylinux_2_28 (RHEL 8) build successful!')
          "

      - name: Test density module
        run: |
          /opt/python/cp310-cp310/bin/python -c "
          import numpy as np
          import _tessera as ts

          config = ts.density.TetraDensityConfig()
          config.lagrangian_grid_size = 8
          config.box_size = 10.0
          config.output_cells = 16
          config.n_samples = 10
          config.n_threads = 1
          config.periodic = True

          positions = np.random.uniform(0, 10, (8**3, 3)).astype(np.float64)
          positions = np.ascontiguousarray(positions)

          result = ts.density.compute_tetra_density_2d_projection(positions, config, 2)
          print(f'2D projection test passed: {len(result.density)} cells')
          "

      - name: Test ORIGAMI module
        run: |
          /opt/python/cp310-cp310/bin/python -c "
          import numpy as np
          import _tessera as ts

          config = ts.origami.OrigamiConfig()
          config.lagrangian_grid_size = 8
          config.box_size = 10.0
          config.n_threads = 1
          config.n_split = 1

          positions = np.random.uniform(0, 10, (8**3, 3)).astype(np.float64)
          positions = np.ascontiguousarray(positions)

          result = ts.origami.compute_morphology(positions, config)
          print(f'ORIGAMI test passed: {len(result.morphology)} particles classified')
          "
